<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Happy Birthday Mame</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Playfair+Display:ital,wght@0,400;0,500;1,400&family=Poppins:wght@300;400;500&display=swap" rel="stylesheet">

<style>
:root {
  color-scheme: light;
  --pink: #d77c9b;
  --dark-pink: #a94e70;
  --light-pink: #fff0f4;
  --blush: #f8dce5;
  --cream: #fffaf7;
  --gold: #c9a66b;
  --text: #694b55;
  --line: #f0d6de;
  --shadow: rgba(169, 78, 112, .18);
  --script: 'Great Vibes', 'Snell Roundhand', cursive;
  --serif: 'Playfair Display', Georgia, serif;
  --sans: 'Poppins', system-ui, -apple-system, 'Segoe UI', sans-serif;
}

* { margin: 0; padding: 0; box-sizing: border-box; }
html { scroll-behavior: smooth; }

[hidden] { display: none !important; }

body {
  display: flex;
  flex-direction: column;
  min-height: 100vh;
  min-height: 100svh;
  background: var(--cream);
  color: var(--text);
  font-family: var(--sans);
  font-size: 15px;
  line-height: 1.8;
  overflow-x: hidden;
}

button { font-family: inherit; cursor: pointer; }
:focus-visible { outline: 3px solid var(--dark-pink); outline-offset: 3px; border-radius: 6px; }

.in {
  max-width: 980px;
  margin: 0 auto;
  padding-left: max(18px, env(safe-area-inset-left, 0px));
  padding-right: max(18px, env(safe-area-inset-right, 0px));
}

body::before {
  content: "";
  position: fixed;
  inset: 0 0 auto 0;
  height: env(safe-area-inset-top, 0px);
  background: var(--cream);
  z-index: 40;
}
.tabs {
  position: sticky;
  top: env(safe-area-inset-top, 0px);
  z-index: 30;
  background: rgba(255, 250, 247, .92);
  -webkit-backdrop-filter: blur(10px);
  backdrop-filter: blur(10px);
  border-bottom: 1px solid var(--line);
}
.tabs .in { display: flex; justify-content: center; gap: 6px; padding-block: 10px; overflow-x: auto; }
.tab {
  border: 0;
  background: transparent;
  color: var(--text);
  padding: 10px 20px;
  border-radius: 30px;
  font-size: 12px;
  letter-spacing: 1.6px;
  text-transform: uppercase;
  white-space: nowrap;
  transition: background .25s, color .25s;
}
.tab:hover { background: var(--light-pink); }
.tab[aria-current="page"] { background: var(--dark-pink); color: white; }

main { flex: 1 0 auto; display: flex; flex-direction: column; }
.panel { flex: 0 0 auto; }
.panel.grow { flex: 1 0 auto; }
.panel:not(.hero) > .in { animation: panelIn .6s both; }
@keyframes panelIn { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: none; } }
.primary-btn.ghost { background: transparent; color: var(--dark-pink); box-shadow: none; }
.primary-btn.ghost:hover { background: var(--dark-pink); color: white; }
.next { margin-top: 44px; }

.petal {
  position: fixed;
  top: -30px;
  z-index: 10;
  pointer-events: none;
  animation: fall linear forwards;
  opacity: .8;
}
@keyframes fall {
  to { transform: translate(var(--dx, 0), 110vh) rotate(650deg); opacity: 0; }
}

.hero {
  display: flex;
  align-items: center;
  justify-content: center;
  text-align: center;
  padding-block: 70px;
  position: relative;
  overflow: hidden;
  background-color: var(--light-pink);
  background-image:
    linear-gradient(rgba(255,244,247,.72), rgba(255,250,247,.94)),
    url("https://images.unsplash.com/photo-1490750967868-88aa4486c946?w=1600");
  background-position: center;
  background-size: cover;
}
.hero::before, .hero::after {
  content: "";
  position: absolute;
  border-radius: 50%;
  filter: blur(40px);
  pointer-events: none;
}
.hero::before { width: 340px; height: 340px; left: -90px; top: -60px; background: #f6c4d3; opacity: .55; }
.hero::after { width: 380px; height: 380px; right: -110px; bottom: -80px; background: #f3d9b4; opacity: .45; }
.hero .in { position: relative; z-index: 1; }
.hero .in > * { animation: rise .9s both; animation-delay: calc(var(--d, 0) * .14s); }

@keyframes rise {
  from { opacity: 0; transform: translateY(18px); }
  to { opacity: 1; transform: none; }
}

.flower { font-size: 34px; margin-bottom: 10px; display: inline-block; animation: rise .9s both, sway 5s ease-in-out infinite alternate !important; }
@keyframes sway { from { transform: rotate(-8deg); } to { transform: rotate(8deg); } }

.small-title {
  color: var(--dark-pink);
  letter-spacing: 5px;
  font-size: 11px;
  text-transform: uppercase;
  margin-bottom: 22px;
}

.hero h1 {
  font-family: var(--script);
  font-size: clamp(58px, 12.5vw, 120px);
  color: var(--dark-pink);
  font-weight: 400;
  line-height: 1.15;
  text-shadow: 0 6px 30px rgba(255,255,255,.9);
  text-wrap: balance;
}

.hero h2 {
  font-family: var(--serif);
  font-size: clamp(18px, 4vw, 28px);
  font-weight: 400;
  margin-top: 12px;
  text-wrap: balance;
}

.hero p {
  max-width: 480px;
  font-size: 14px;
  line-height: 2;
  margin: 22px auto 30px;
}

.primary-btn {
  display: inline-block;
  border: 1px solid var(--dark-pink);
  color: white;
  background: var(--dark-pink);
  padding: 14px 32px;
  border-radius: 40px;
  letter-spacing: 1.5px;
  font-size: 12px;
  text-decoration: none;
  text-transform: uppercase;
  transition: .3s;
  box-shadow: 0 8px 22px var(--shadow);
}
.primary-btn:hover { background: transparent; color: var(--dark-pink); transform: translateY(-3px); }

.music-btn {
  position: fixed;
  z-index: 20;
  bottom: calc(18px + env(safe-area-inset-bottom, 0px));
  right: calc(18px + env(safe-area-inset-right, 0px));
  background: white;
  border: 1px solid #e8bdca;
  color: var(--dark-pink);
  border-radius: 30px;
  padding: 12px 18px;
  box-shadow: 0 6px 22px var(--shadow);
  font-size: 12px;
}

.back-btn {
  position: fixed;
  z-index: 20;
  bottom: calc(18px + env(safe-area-inset-bottom, 0px));
  left: calc(18px + env(safe-area-inset-left, 0px));
  background: white;
  border: 1px solid #e8bdca;
  color: var(--dark-pink);
  border-radius: 30px;
  padding: 12px 18px;
  box-shadow: 0 6px 22px var(--shadow);
  font-size: 12px;
  text-decoration: none;
}

.arrive {
  position: fixed;
  inset: 0;
  z-index: 500;
  background: #fff;
  pointer-events: none;
  animation: arrive .9s .1s ease-out forwards;
}
@keyframes arrive { to { opacity: 0; visibility: hidden; } }

section { padding-block: clamp(64px, 11vw, 100px); text-align: center; }

.section-label {
  color: var(--pink);
  text-transform: uppercase;
  letter-spacing: 4px;
  font-size: 10px;
  margin-bottom: 14px;
}
.section-title {
  font-family: var(--serif);
  font-size: clamp(30px, 6vw, 46px);
  font-weight: 400;
  color: var(--dark-pink);
  margin-bottom: 20px;
  line-height: 1.25;
  text-wrap: balance;
}
.section-text { max-width: 620px; margin: auto; font-size: 14px; line-height: 2.1; }

.letter-section { background: var(--light-pink); }

.envelope-wrap { margin: 42px auto 0; max-width: 760px; }

.envelope {
  position: relative;
  overflow: hidden;
  background: #f6cbd7;
  border: 1px solid #e8aebe;
  max-width: 460px;
  margin-inline: auto;
  padding: 74px 26px 36px;
  border-radius: 8px;
  box-shadow: 0 18px 44px var(--shadow);
  transition: transform .4s;
}
.envelope::before {
  content: "";
  position: absolute;
  inset: 0 0 auto 0;
  height: 62px;
  background: #eeb3c4;
  clip-path: polygon(0 0, 100% 0, 50% 100%);
  transition: transform .6s;
  transform-origin: top;
}
.envelope.open::before { transform: rotateX(180deg); }
.envelope:hover { transform: translateY(-5px); }
.envelope-icon { font-size: 52px; line-height: 1; margin-bottom: 12px; }
.envelope h3 { font-family: var(--serif); color: var(--dark-pink); font-size: 24px; font-weight: 400; margin-bottom: 8px; }
.envelope p { font-size: 13px; margin-bottom: 20px; }

.letter-box {
  display: grid;
  grid-template-rows: 0fr;
  transition: grid-template-rows .9s ease, margin-top .9s ease;
  margin-top: 0;
}
.letter-box { scroll-margin-top: calc(76px + env(safe-area-inset-top, 0px)); }
.letter-box.show { grid-template-rows: 1fr; margin-top: 22px; }
.letter-clip { overflow: hidden; min-height: 0; }
.letter {
  text-align: left;
  background: white;
  padding: clamp(28px, 6vw, 56px) clamp(22px, 6vw, 60px);
  border: 1px solid var(--line);
  border-radius: 10px;
  line-height: 2;
  font-size: clamp(16px, 2.4vw, 19px);
  box-shadow: 0 12px 30px var(--shadow);
}
.letter p { margin-bottom: 22px; opacity: 0; transform: translateY(12px); transition: opacity .7s, transform .7s; }
.letter-box.show .letter p, .letter-box.show .signature { opacity: 1; transform: none; transition-delay: calc(var(--n) * .25s + .35s); }
.letter .greet { font-family: var(--serif); font-size: clamp(24px, 4vw, 32px); line-height: 1.5; color: var(--dark-pink); }
.signature {
  font-family: var(--script);
  font-size: clamp(40px, 7vw, 56px);
  line-height: 1.3;
  color: var(--dark-pink);
  margin-top: 10px;
  opacity: 0;
  transform: translateY(12px);
  transition: opacity .7s, transform .7s;
}

.gallery { background: var(--cream); }

.gallery { position: relative; overflow: hidden; }
.gallery .in { position: relative; z-index: 1; }
.deco { position: absolute; color: var(--pink); opacity: .13; pointer-events: none; }
.deco svg { width: 100%; height: 100%; display: block; }
.deco.d1 { width: 260px; height: 260px; top: -60px; right: -70px; transform: rotate(18deg); }
.deco.d2 { width: 200px; height: 200px; bottom: 60px; left: -70px; transform: rotate(-14deg); }

.orn { display: flex; align-items: center; justify-content: center; gap: 14px; margin: 26px auto 0; max-width: 260px; color: var(--pink); }
.orn span { flex: 1; height: 1px; background: linear-gradient(90deg, transparent, var(--pink)); }
.orn span:last-child { background: linear-gradient(270deg, transparent, var(--pink)); }
.orn svg { width: 22px; height: 22px; }

.gallery-grid { column-count: 3; column-gap: 24px; max-width: 900px; margin: 52px auto 0; padding-inline: 6px; }

.shot {
  position: relative;
  display: block;
  break-inside: avoid;
  margin-bottom: 30px;
  background: white;
  padding: 12px 12px 6px;
  border: 1px solid var(--line);
  border-radius: 3px;
  box-shadow: 0 12px 30px var(--shadow), 0 2px 5px rgba(105, 75, 85, .08);
  transform: rotate(var(--r, 0deg));
  transition: transform .4s ease, box-shadow .4s ease;
  animation: pop .7s backwards;
  animation-delay: calc(var(--i, 0) * .07s + .1s);
}
.shot:hover { transform: rotate(0deg) translateY(-8px) scale(1.03); box-shadow: 0 22px 44px var(--shadow); z-index: 2; }
@keyframes pop {
  from { opacity: 0; transform: translateY(26px) rotate(var(--r, 0deg)) scale(.96); }
  to { opacity: 1; transform: rotate(var(--r, 0deg)); }
}
.tape {
  position: absolute;
  top: -13px;
  left: 50%;
  width: 88px;
  height: 26px;
  margin-left: -44px;
  transform: rotate(var(--tr, -3deg));
  background:
    repeating-linear-gradient(90deg, rgba(255,255,255,.28) 0 6px, transparent 6px 12px),
    var(--tape, rgba(215, 124, 155, .55));
  box-shadow: 0 2px 6px rgba(105, 75, 85, .12);
  pointer-events: none;
}
.shot:nth-child(3n+2) { --tape: rgba(201, 166, 107, .55); }
.shot:nth-child(3n) { --tape: rgba(246, 203, 215, .85); }
.shot .pic { position: relative; overflow: hidden; background: linear-gradient(135deg, #fbe3ea, #f6cbd7); }
.shot.missing .pic { aspect-ratio: var(--ar, 4 / 5); }
.shot img { width: 100%; height: auto; display: block; cursor: zoom-in; }
.shot .ph { display: none; position: absolute; inset: 0; place-items: center; color: var(--pink); }
.shot .ph svg { width: 40%; opacity: .7; }
.shot.missing .ph { display: grid; }
.shot.missing img { display: none; }
.shot figcaption { font-family: var(--script); font-size: 25px; line-height: 1.7; color: var(--dark-pink); text-align: center; padding-top: 6px; }

.lightbox {
  position: fixed;
  inset: 0;
  z-index: 50;
  display: none;
  align-items: center;
  justify-content: center;
  background: rgba(60, 25, 40, .88);
  padding: 24px;
}
.lightbox.show { display: flex; }
.lightbox img { max-width: 100%; max-height: 100%; border: 8px solid white; border-radius: 6px; box-shadow: 0 20px 60px rgba(0,0,0,.5); }
.lb-btn {
  position: absolute;
  top: 50%;
  transform: translateY(-50%);
  width: 46px;
  height: 46px;
  border-radius: 50%;
  border: 0;
  background: rgba(255,255,255,.92);
  color: var(--dark-pink);
  font-size: 20px;
  line-height: 1;
}
.lb-cap { position: absolute; left: 0; right: 0; bottom: calc(18px + env(safe-area-inset-bottom, 0px)); text-align: center; color: white; font-size: 12px; letter-spacing: 3px; pointer-events: none; }
.lb-prev { left: max(10px, env(safe-area-inset-left, 0px)); }
.lb-next { right: max(10px, env(safe-area-inset-right, 0px)); }

.cake-section { background: var(--light-pink); }
.cake { font-size: 104px; line-height: 1.2; margin: 24px auto 8px; animation: bounce 2.2s infinite ease-in-out; display: inline-block; filter: drop-shadow(0 14px 18px var(--shadow)); }
@keyframes bounce { 50% { transform: translateY(-12px); } }
.cake-message { font-family: var(--serif); font-style: italic; color: var(--dark-pink); font-size: 19px; margin-bottom: 26px; }
.wish-message { margin: 24px auto 0; min-height: 3.5em; max-width: 440px; font-family: var(--serif); font-style: italic; font-size: 18px; color: var(--dark-pink); }

.final-section { background: var(--blush); padding-block: clamp(72px, 12vw, 110px); }
.final-section .big { font-size: 36px; margin-bottom: 6px; }
.final-section h2 { font-family: var(--script); font-size: clamp(54px, 10.5vw, 90px); color: var(--dark-pink); font-weight: 400; line-height: 1.15; text-wrap: balance; }
.final-section p { font-family: var(--serif); margin: 18px auto 0; font-size: 18px; line-height: 2; max-width: 520px; }
.final-section p.again { font-family: var(--sans); font-size: 13px; margin-top: 28px; }

footer { background: var(--dark-pink); color: white; text-align: center; padding: 26px 18px; font-size: 11px; letter-spacing: 1.5px; text-transform: uppercase; }

@media (max-width: 480px) {
  .section-text { font-size: 15px; line-height: 2; }
  .envelope { padding: 70px 20px 28px; }
  .letter { line-height: 1.95; }
  .cake { font-size: 88px; }
  .primary-btn { padding: 13px 24px; }
}
@media (max-width: 650px) {
  .tab { padding: 10px 14px; letter-spacing: 1px; }
  .gallery-grid { column-count: 2; column-gap: 14px; padding-inline: 0; }
  .shot { padding: 8px 8px 4px; margin-bottom: 22px; }
  .shot figcaption { font-size: 20px; }
  .tape { width: 64px; margin-left: -32px; height: 22px; }
}
@media (prefers-reduced-motion: reduce) {
  html { scroll-behavior: auto; }
  *, *::before, *::after { animation-duration: .001s !important; animation-iteration-count: 1 !important; transition-duration: .001s !important; transition-delay: 0s !important; }
}
</style>
</head>

<body>

<div class="arrive" id="arrive" hidden></div>

<svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false">
  <symbol id="flower" viewBox="-60 -60 120 120">
    <g fill="currentColor">
      <ellipse cx="0" cy="-27" rx="13" ry="27"/>
      <ellipse cx="0" cy="-27" rx="13" ry="27" transform="rotate(72)"/>
      <ellipse cx="0" cy="-27" rx="13" ry="27" transform="rotate(144)"/>
      <ellipse cx="0" cy="-27" rx="13" ry="27" transform="rotate(216)"/>
      <ellipse cx="0" cy="-27" rx="13" ry="27" transform="rotate(288)"/>
    </g>
    <circle r="9" fill="#c9a66b"/>
  </symbol>
</svg>

<audio id="bgMusic" loop preload="none">
  <source src="assets/music1.mp3" type="audio/mpeg">
</audio>

<a class="back-btn" href="../index.html">← My Little Universe</a>
<button class="music-btn" id="musicBtn" type="button" aria-pressed="false"></button>

<nav class="tabs" aria-label="Pages">
  <div class="in">
    <button class="tab" type="button" data-go="home" aria-current="page">Home</button>
    <button class="tab" type="button" data-go="letter">Letter</button>
    <button class="tab" type="button" data-go="photos">Photos</button>
    <button class="tab" type="button" data-go="wish">Wish</button>
  </div>
</nav>

<main id="main">

<header class="hero panel grow" data-tab="home">
  <div class="in">
    <div class="flower" style="--d:0">🌸</div>
    <div class="small-title" style="--d:1" data-i="eyebrow"></div>
    <h1 style="--d:2" data-i="h1"></h1>
    <h2 style="--d:3" data-i="h2"></h2>
    <p style="--d:4" data-i="intro"></p>
    <button class="primary-btn" style="--d:5" type="button" data-go="letter" data-i="cta"></button>
  </div>
</header>

<section class="letter-section panel grow" data-tab="letter" hidden>
  <div class="in">
    <div class="section-label" data-i="letterLabel"></div>
    <h2 class="section-title" data-i="letterTitle"></h2>
    <p class="section-text" data-i="letterIntro"></p>

    <div class="envelope-wrap">
      <div class="envelope" id="envelope">
        <div class="envelope-icon">💌</div>
        <h3 data-i="envTitle"></h3>
        <p data-i="envSub"></p>
        <button class="primary-btn" id="letterBtn" type="button" aria-expanded="false" aria-controls="letterBox"></button>
      </div>

      <div class="letter-box" id="letterBox" inert>
        <div class="letter-clip">
          <div class="letter">
            <p class="greet" data-i="l0"></p>
            <p data-i="l1"></p>
            <p data-i="l2"></p>
            <p data-i="l3"></p>
            <p data-i="l4"></p>
            <p data-i="l5"></p>
            <p data-i="l6"></p>
            <div class="signature" data-i="sig"></div>
          </div>
        </div>
      </div>
    </div>

    <div class="next"><button class="primary-btn ghost" type="button" data-go="photos">See our moments &rarr;</button></div>
  </div>
</section>

<section class="gallery panel grow" data-tab="photos" hidden>
  <div class="deco d1" aria-hidden="true"><svg viewBox="-60 -60 120 120"><use href="#flower"/></svg></div>
  <div class="deco d2" aria-hidden="true"><svg viewBox="-60 -60 120 120"><use href="#flower"/></svg></div>
  <div class="in">
    <div class="section-label" data-i="galLabel"></div>
    <h2 class="section-title" data-i="galTitle"></h2>
    <p class="section-text" data-i="galText"></p>
    <div class="orn" aria-hidden="true"><span></span><svg viewBox="-60 -60 120 120"><use href="#flower"/></svg><span></span></div>

    <div class="gallery-grid" id="grid"></div>

    <div class="next"><button class="primary-btn ghost" type="button" data-go="wish">Make a wish &rarr;</button></div>
  </div>
</section>

<div class="lightbox" id="lightbox" role="dialog" aria-label="Photo viewer">
  <button class="lb-btn lb-prev" id="lbPrev" type="button" aria-label="Previous photo">&larr;</button>
  <img alt="">
  <div class="lb-cap" id="lbCap"></div>
  <button class="lb-btn lb-next" id="lbNext" type="button" aria-label="Next photo">&rarr;</button>
</div>

<section class="cake-section panel" data-tab="wish" hidden>
  <div class="in">
    <div class="section-label" data-i="wishLabel"></div>
    <h2 class="section-title" data-i="wishTitle"></h2>

    <div class="cake" id="cake">🎂</div>

    <p class="cake-message" data-i="wishText"></p>

    <button class="primary-btn" id="wishBtn" type="button"></button>

    <p class="wish-message" id="wishMessage" aria-live="polite"></p>
  </div>
</section>

<section class="final-section panel grow" data-tab="wish" hidden>
  <div class="in">
    <div class="big">🌷 🤍 🌸</div>
    <h2 data-i="finalH"></h2>
    <p data-i="finalP"></p>
    <p class="again" data-i="finalS"></p>
    <div class="next"><button class="primary-btn ghost" type="button" data-go="home">Back to the start</button></div>
  </div>
</section>

</main>

<footer data-i="footer"></footer>

<script>
(function () {
  var T = {
    en: {
      eyebrow: "A special day for someone special",
      h1: "Happy Birthday",
      h2: "To my dearest Mame",
      intro: "Today is a celebration of the beautiful soul who makes life warmer, brighter, and more meaningful. This little website is made with so much love, just for you.",
      cta: "Open your surprise ♡",
      letterLabel: "A little something from the heart",
      letterTitle: "A Letter for You",
      letterIntro: "Some words are too special to leave unsaid. So today, I want you to know how much you mean to me.",
      envTitle: "For You, Mame",
      envSub: "A little letter filled with love.",
      l0: "Dear Mame,",
      l1: "Happy Birthday, Mame. ❤️",
      l2: "In the stories I read on Wattpad, there is always one woman everyone remembers: fierce, unshakable, and soft-hearted all at once. She stands up for what is right even when the whole room goes quiet, and she never lets a wrong thing slide just because it is easier to stay silent. Mame, that woman is you, and you are not even fiction.",
      l3: "You are the one who asks me, every single time I go out, “Do you have money with you? Who are you with?” Before, I would just answer and leave. Now I understand those two questions were never about being nosy. They were your way of making sure I come home safe. You have been protecting me my whole life, one question at a time.",
      l4: "You lecture my sibling too, and yes, sometimes it feels like we are in an argument with you again. You are loud when it matters, you are stubborn, and we have had our share of clashes. But even in the middle of the loudest fight, your care has never gone missing, not once. Everything you say comes from a heart that refuses to let any of us go the wrong way.",
      l5: "Mame, you deserve the world. But the truth is, the world does not deserve a woman as strong and sweet as you. All I can do is love you back as fiercely as you have loved us, and thank you for every sacrifice I never said thank you for.",
      l6: "May you always have good health, peace, and a thousand more birthdays where we get to celebrate you the way you have always taken care of us. I love you so much, Mame. Happy Birthday! 🌷",
      sig: "With all my love ♡",
      galLabel: "Memories we treasure",
      galTitle: "Our Little Moments",
      galText: "Every picture holds a memory, and every memory is a reminder of how lucky I am to have you.",
      wishLabel: "Make a wish",
      wishTitle: "A Wish Just For You",
      wishText: "May all your wishes bloom as beautifully as flowers.",
      wish: "Make a wish ✨",
      wishDone: "✨ May your heart's wishes come true. We love you, Mame! 💗",
      finalH: "We love you, Mame!",
      finalP: "Strong, sweet, and endlessly loving. Today and always, you deserve to be celebrated.",
      finalS: "Happy Birthday once again! ♡",
      footer: "Made with love, just for Mame 🌸",
      play: "♫ Play Music", pause: "♫ Pause Music",
      open: "Open my letter", close: "Close the letter"
    }
  };

  var lang = "en";

  var $ = function (id) { return document.getElementById(id); };
  var letterBtn = $("letterBtn"), letterBox = $("letterBox");
  var envelope = $("envelope"), wishBtn = $("wishBtn"), wishMessage = $("wishMessage");
  var musicBtn = $("musicBtn"), music = $("bgMusic");
  var letterOpen = false, wished = false, playing = false;

  function applyLang() {
    var d = T[lang];
    document.documentElement.lang = lang === "tl" ? "fil" : "en";
    var els = document.querySelectorAll("[data-i]");
    for (var i = 0; i < els.length; i++) els[i].textContent = d[els[i].getAttribute("data-i")];
    letterBtn.textContent = letterOpen ? d.close : d.open;
    wishBtn.textContent = d.wish;
    wishMessage.textContent = wished ? d.wishDone : "";
    musicBtn.textContent = playing ? d.pause : d.play;
  }

  var kids = letterBox.querySelectorAll(".letter > *");
  for (var k = 0; k < kids.length; k++) kids[k].style.setProperty("--n", k);

  letterBtn.addEventListener("click", function () {
    letterOpen = !letterOpen;
    letterBox.classList.toggle("show", letterOpen);
    envelope.classList.toggle("open", letterOpen);
    if (letterOpen) letterBox.removeAttribute("inert"); else letterBox.setAttribute("inert", "");
    letterBtn.setAttribute("aria-expanded", String(letterOpen));
    letterBtn.textContent = letterOpen ? T[lang].close : T[lang].open;
    if (letterOpen) {
      burst(8);
      setTimeout(function () { letterBox.scrollIntoView({ behavior: "smooth", block: "start" }); }, 350);
    }
  });

  var PHOTO_COUNT = 12;
  var FOLDERS = ["", "photos/", "Photos/", "pictures/", "Pictures/", "images/", "Images/", "img/", "pics/", "photo/", "picture/", "assets/"];
  var EXTS = ["jpg", "jpeg", "png", "webp", "JPG", "JPEG", "PNG", "WEBP"];
  var grid = $("grid");
  var shots = [];
  var lightbox = $("lightbox"), lbImg = lightbox.querySelector("img"), lbIndex = 0;

  var CAPS = ["Together", "Pure joy", "Sweet memory", "With love", "Always smiling", "Treasured", "Our moment", "Blessed", "Forever", "Home", "Happy times", "Our Mame"];
  var TILT = [-2.2, 1.6, -1.1, 2, -1.7, 1.2, -2, 1.4, -1.2, 2.2, -1.5, 1.1];
  var RATIO = ["4 / 5", "1 / 1", "3 / 4", "4 / 5", "5 / 4", "3 / 4"];
  var lbCap = $("lbCap");

  for (var n = 1; n <= PHOTO_COUNT; n++) {
    var fig = document.createElement("figure");
    fig.className = "shot missing";
    fig.style.setProperty("--i", n - 1);
    fig.style.setProperty("--r", TILT[(n - 1) % TILT.length] + "deg");
    fig.style.setProperty("--tr", (TILT[(n + 3) % TILT.length] * 1.5) + "deg");
    fig.style.setProperty("--ar", RATIO[(n - 1) % RATIO.length]);
    fig.innerHTML = '<span class="tape"></span><div class="pic"><img alt="A memory with Mame"><div class="ph"><svg viewBox="-60 -60 120 120" aria-hidden="true"><use href="#flower"/></svg></div></div><figcaption>' + CAPS[(n - 1) % CAPS.length] + '</figcaption>';
    grid.appendChild(fig);
    shots.push(fig);
  }

  function probe(src) {
    return new Promise(function (resolve) {
      var im = new Image();
      im.onload = function () { resolve(true); };
      im.onerror = function () { resolve(false); };
      im.src = src;
    });
  }
  async function find(num, folders, exts) {
    for (var a = 0; a < folders.length; a++) {
      for (var b = 0; b < exts.length; b++) {
        var src = folders[a] + num + "." + exts[b];
        if (await probe(src)) return { src: src, folder: folders[a], ext: exts[b], n: num };
      }
    }
    return null;
  }

  (async function () {
    var base = null;
    for (var num = 1; num <= PHOTO_COUNT && !base; num++) base = await find(num, FOLDERS, EXTS);
    if (!base) return;
    var order = [base.ext].concat(EXTS.filter(function (e) { return e !== base.ext; }));
    await Promise.all(shots.map(async function (fig, i) {
      var r = (i + 1 === base.n) ? base : await find(i + 1, [base.folder], order);
      if (r) {
        fig.querySelector("img").src = r.src;
        fig.classList.remove("missing");
      }
    }));
    shots = shots.filter(function (fig) {
      if (fig.classList.contains("missing")) { fig.remove(); return false; }
      return true;
    });
    shots.forEach(function (fig, i) { fig.style.setProperty("--i", i); });
  })();

  function openPhoto(i) {
    lbIndex = (i + shots.length) % shots.length;
    var img = shots[lbIndex].querySelector("img");
    lbImg.src = img.src;
    lbCap.textContent = (lbIndex + 1) + " / " + shots.length;
    lightbox.classList.add("show");
  }
  grid.addEventListener("click", function (e) {
    var fig = e.target.closest ? e.target.closest(".shot") : null;
    if (!fig || fig.classList.contains("missing")) return;
    openPhoto(shots.indexOf(fig));
  });
  $("lbPrev").addEventListener("click", function (e) { e.stopPropagation(); openPhoto(lbIndex - 1); });
  $("lbNext").addEventListener("click", function (e) { e.stopPropagation(); openPhoto(lbIndex + 1); });
  lightbox.addEventListener("click", function () { lightbox.classList.remove("show"); });
  document.addEventListener("keydown", function (e) {
    if (!lightbox.classList.contains("show")) return;
    if (e.key === "Escape") lightbox.classList.remove("show");
    if (e.key === "ArrowLeft") openPhoto(lbIndex - 1);
    if (e.key === "ArrowRight") openPhoto(lbIndex + 1);
  });

  var reduce = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  var EMOJI = ["🌸", "🌷", "♡", "🌺"];
  function petal() {
    var p = document.createElement("div");
    p.className = "petal";
    p.textContent = EMOJI[Math.floor(Math.random() * EMOJI.length)];
    p.style.left = Math.random() * 100 + "vw";
    p.style.fontSize = (12 + Math.random() * 18) + "px";
    p.style.animationDuration = (6 + Math.random() * 6) + "s";
    p.style.setProperty("--dx", (Math.random() * 140 - 70) + "px");
    document.body.appendChild(p);
    setTimeout(function () { if (p.parentNode) p.parentNode.removeChild(p); }, 12500);
  }
  function burst(n) { if (reduce) return; for (var i = 0; i < n; i++) setTimeout(petal, i * 80); }
  if (!reduce) setInterval(function () { if (!document.hidden) petal(); }, 1600);

  wishBtn.addEventListener("click", function () {
    wished = true;
    wishMessage.textContent = T[lang].wishDone;
    burst(30);
  });

  var BEAT = 0.55;
  var SONG = [
    [392,.75],[392,.25],[440,1],[392,1],[523.25,1],[493.88,2],
    [392,.75],[392,.25],[440,1],[392,1],[587.33,1],[523.25,2],
    [392,.75],[392,.25],[783.99,1],[659.25,1],[523.25,1],[493.88,1],[440,1],
    [698.46,.75],[698.46,.25],[659.25,1],[523.25,1],[587.33,1],[523.25,2]
  ];
  var ctx = null, loopTimer = null, usingFile = false;

  function playOnce(t0) {
    var t = t0;
    for (var i = 0; i < SONG.length; i++) {
      var f = SONG[i][0], dur = SONG[i][1] * BEAT;
      var o = ctx.createOscillator(), o2 = ctx.createOscillator(), g = ctx.createGain();
      o.type = "sine"; o.frequency.value = f;
      o2.type = "triangle"; o2.frequency.value = f * 2;
      g.gain.setValueAtTime(0.0001, t);
      g.gain.exponentialRampToValueAtTime(0.16, t + 0.015);
      g.gain.exponentialRampToValueAtTime(0.0001, t + Math.max(dur * 1.9, 0.7));
      o.connect(g); o2.connect(g); g.connect(ctx.destination);
      o.start(t); o2.start(t);
      o.stop(t + 1.6); o2.stop(t + 1.6);
      t += dur;
    }
    return t - t0;
  }
  function loop() {
    var len = playOnce(ctx.currentTime + 0.1);
    loopTimer = setTimeout(loop, (len + 2.2) * 1000);
  }
  function startSynth() {
    var AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return false;
    try { ctx = new AC(); if (ctx.state === "suspended") ctx.resume(); } catch (e) { return false; }
    loop();
    return true;
  }
  function stopAll() {
    clearTimeout(loopTimer);
    if (ctx) { try { ctx.close(); } catch (e) {} ctx = null; }
    if (usingFile) { music.pause(); usingFile = false; }
  }
  function setPlaying(v) {
    playing = v;
    musicBtn.setAttribute("aria-pressed", String(v));
    musicBtn.textContent = v ? T[lang].pause : T[lang].play;
  }
  musicBtn.addEventListener("click", function () {
    if (playing) { stopAll(); setPlaying(false); return; }
    setPlaying(true);
    var p;
    try { p = music.play(); } catch (e) { p = null; }
    if (p && p.then) {
      p.then(function () { usingFile = true; }).catch(function () {
        if (!startSynth()) setPlaying(false);
      });
    } else if (!startSynth()) {
      setPlaying(false);
    }
  });

  var TABS = ["home", "letter", "photos", "wish"];
  var panels = document.querySelectorAll("[data-tab]");
  var tabBtns = document.querySelectorAll(".tab");
  var current = "";

  function show(name) {
    if (TABS.indexOf(name) < 0) name = "home";
    if (name === current) return;
    current = name;
    Array.prototype.forEach.call(panels, function (p) { p.hidden = p.getAttribute("data-tab") !== name; });
    Array.prototype.forEach.call(tabBtns, function (b) {
      if (b.getAttribute("data-go") === name) b.setAttribute("aria-current", "page");
      else b.removeAttribute("aria-current");
    });
    lightbox.classList.remove("show");
    window.scrollTo(0, 0);
    if (name === "wish") burst(10);
  }
  function go(name) {
    show(name);
    try { if (location.hash !== "#" + name) location.hash = name; } catch (e) {}
  }
  Array.prototype.forEach.call(document.querySelectorAll("[data-go]"), function (b) {
    b.addEventListener("click", function () { go(b.getAttribute("data-go")); });
  });
  window.addEventListener("hashchange", function () { show(location.hash.replace("#", "")); });
  show(location.hash.replace("#", "") || "home");
  current = current || "home";

  try {
    var ref = document.referrer && new URL(document.referrer);
    if (ref && ref.origin === location.origin && ref.pathname.indexOf("birthday-for-mame") < 0) {
      var ar = $("arrive");
      ar.hidden = false;
      setTimeout(function () { ar.remove(); }, 1200);
    }
  } catch (e) {}

  applyLang();
})();
</script>
